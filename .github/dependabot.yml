# .github/dependabot.yml
# Docs: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # @astrojs/check accepts TypeScript 5 and 6;
      # waits on TypeScript 7.1: https://github.com/withastro/astro/issues/17268
      - dependency-name: typescript
        versions: [">=7"]
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    labels:
      - dependencies
    cooldown:
      default-days: 7
